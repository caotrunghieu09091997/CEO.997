
<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>TOOL TỔNG TIỀN 39 MÃ - CEO.997</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef4fc;color:#183153;margin:0;padding:12px}
main{max-width:850px;margin:auto}
h1{color:#1565df;text-align:center;font-size:24px}
#editor{background:white;border:2px solid #8ab5ee;border-radius:12px;min-height:180px;max-height:350px;overflow:auto;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;font:bold 17px/1.6 monospace}
#editor:empty:before{content:"Dán danh sách đơn vào đây...";color:#999}
button{border:0;border-radius:9px;color:white;background:#1763df;padding:14px 10px;font-weight:bold;cursor:pointer;flex:1}
button:disabled{background:#9ca3af}
.row{display:flex;gap:8px;margin:10px 0}
.red{background:#dc2626}
.green{background:#079447}
.gray{background:#53657b}
.total{border-radius:16px;text-align:center;color:white;padding:20px;margin:10px 0;font-weight:bold}
.total strong{display:block;font-size:40px;margin-top:8px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;background:white;font-size:13px;table-layout:fixed}
th{background:#174da5;color:white;padding:12px 4px}
td{text-align:center;padding:7px 3px;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
tr:nth-child(even){background:#f0f6ff}
tr.active{background:#d9f8e3}
td:last-child{color:#087b40;font-weight:bold}
input{width:100%;max-width:90px;text-align:center;padding:8px 2px;border:1px solid #b7c8dd;border-radius:6px;font-size:16px}
#status,#note{padding:8px 0;font-size:13px;text-align:center}
.good{color:#07883f}
.bad{color:#dc2626}
</style>
</head>
<body>
<main>
<h1>TOOL TỔNG TIỀN 39 MÃ</h1>

<div id="editor" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>

<div id="status"></div>

<div class="row">
<button class="red" id="remove">XÓA HẾT DÒNG ĐỎ</button>
</div>

<div class="row">
<button class="green" id="add" disabled>KIỂM TRA &amp; CỘNG DỒN</button>
</div>

<div class="total" style="background:linear-gradient(120deg,#1249ba,#2196f3)">
TỔNG SỐ ĐƠN
<strong id="count">0</strong>
</div>

<div class="total" style="background:linear-gradient(120deg,#05733d,#22c55e)">
TỔNG SỐ TIỀN
<strong id="money">0đ</strong>
</div>

<div class="row">
<button id="copy">SAO CHÉP KẾT QUẢ</button>
<button id="copyPrice">SAO CHÉP BẢNG GIÁ</button>
</div>

<div class="row">
<button class="gray" id="toggle">ẨN BẢNG GIÁ</button>
<button class="gray" id="filter">CHỈ HIỆN CÓ ĐƠN</button>
</div>

<div id="note">Giá 100 = 100.000đ</div>

<table>
<thead>
<tr>
<th>MÃ</th>
<th>SỐ LƯỢNG</th>
<th id="priceHead">GIÁ (K)</th>
<th>THÀNH TIỀN</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<div class="row">
<button class="red" id="reset">XÓA SỐ LƯỢNG — GIỮ GIÁ</button>
</div>

</main>
<script>
const $=id=>document.getElementById(id);

const catalog=[
["VP LK",100],
["VP SHOP",25],
["PV",100],
["MB",75],
["MSB",35],
["MSB QD",60],
["LP",35],
["TP",50],
["VC",30],
["MBV",30],
["BAC A 0 GD",20],
["KB",25],
["SHB",40],
["GP 0 GD",17],
["GP QD",40],
["GP 0 RUT",70],
["VIB THE",35],
["VIB 0 THE",25],
["TECH",25],
["VIKKI",17],
["KIS",20],
["HD 0 GD",17],
["HD CO GD",20],
["SEA",0],
["SCB",0],
["VB 0 GD",17],
["VB CO GD",20],
["VIET A 0 GD",17],
["VIET A 0 RUT",70],
["VIET A DL",0],
["BIDV",15],
["TPS",0],
["SSI",0],
["TCI",0],
["BV",0],
["PG",0],
["WR",0],
["HL",0],
["ACB",0]
];

const codes=catalog.map(x=>x[0]);
const sortedCodes=[...codes].sort((a,b)=>b.length-a.length);
let prices=catalog.map(x=>x[1]);
let qty=codes.map(()=>0);
let seen=new Set();
let show=true,only=false;
const storageKey="CEO99739V1";
const ed=$("editor");
const fmt=n=>n.toLocaleString("vi-VN");
const cash=n=>fmt(n)+"đ";

try{
let saved=JSON.parse(localStorage.getItem(storageKey));
if(saved&&Array.isArray(saved.prices)&&saved.prices.length===39){
prices=prices.map((p,i)=>Number.isSafeInteger(saved.prices[i])&&saved.prices[i]>=0?saved.prices[i]:p);
}
if(saved&&Array.isArray(saved.qty)&&saved.qty.length===39){
qty=qty.map((q,i)=>Number.isSafeInteger(saved.qty[i])&&saved.qty[i]>=0?saved.qty[i]:0);
}
if(saved&&Array.isArray(saved.seen)){
seen=new Set(saved.seen);
}
}catch(e){}

function save(){
try{
localStorage.setItem(storageKey,JSON.stringify({
prices,qty,seen:[...seen]
}));
}catch(e){
note("Không thể lưu dữ liệu trên trình duyệt");
}
}

function normalize(s){
return s.trim().toUpperCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/Đ/g,"D")
.replace(/\s+/g," ")
.replace(/QUA DEM/g,"QD")
.replace(/DAT LICH/g,"DL");
}

function parse(s){
s=normalize(s);
for(const c of sortedCodes){
let m=s.match(new RegExp("^"+c+"\\s*[:X×-]?\\s*(\\d+)$"));
if(!m){
m=s.match(new RegExp("^(\\d+)\\s*[:X×-]?\\s*"+c+"$"));
}
if(m){
let n=Number(m[1]);
if(Number.isSafeInteger(n)&&n>0&&n<=999999999){
return {i:codes.indexOf(c),n};
}
}
}
return null;
}

function lines(){
return ed.innerText.replace(/\r/g,"").split("\n");
}

function entries(){
return lines().filter(s=>s.trim());
}

function check(){
let a=entries();
let valid=a.map(parse).filter(Boolean);
let v=valid.reduce((s,x)=>s+x.n,0);
let b=a.length-valid.length;

$("status").innerHTML=
'<span style="color:green;font-weight:bold">Đơn đúng: '+v+
'</span> | <span style="color:red;font-weight:bold">Dòng sai: '+b+'</span>';

$("add").disabled=b>0||v===0;
$("remove").disabled=b===0;
}

function cursor(){
let s=getSelection();
if(!s.rangeCount||!ed.contains(s.anchorNode))return null;
let r=s.getRangeAt(0).cloneRange();
r.selectNodeContents(ed);
r.setEnd(s.anchorNode,s.anchorOffset);
return r.toString().length;
}

function restore(p){
if(p===null)return;
let w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT),n;
while(n=w.nextNode()){
if(p<=n.length){
let r=document.createRange();
r.setStart(n,p);
r.collapse(true);
let s=getSelection();
s.removeAllRanges();
s.addRange(r);
return;
}
p-=n.length;
}
let r=document.createRange();
r.selectNodeContents(ed);
r.collapse(false);
let s=getSelection();
s.removeAllRanges();
s.addRange(r);
}

function paint(a,p=null){
ed.replaceChildren();
a.forEach((s,i)=>{
if(i)ed.append(document.createTextNode("\n"));
let t=document.createElement("span");
t.textContent=s;
t.className=parse(s)?"good":"bad";
ed.append(t);
});
restore(p);
check();
}

let composing=false;

ed.addEventListener("compositionstart",()=>{
composing=true;
});

ed.addEventListener("compositionend",()=>{
composing=false;
let p=cursor();
paint(lines(),p);
});

ed.oninput=()=>{
if(composing)return;
let p=cursor();
paint(lines(),p);
};

function insertText(text){
let s=getSelection();
if(!s.rangeCount||!ed.contains(s.anchorNode)){
ed.focus();
let r=document.createRange();
r.selectNodeContents(ed);
r.collapse(false);
s.removeAllRanges();
s.addRange(r);
}
let r=s.getRangeAt(0);
r.deleteContents();
let node=document.createTextNode(text);
r.insertNode(node);
r.setStartAfter(node);
r.collapse(true);
s.removeAllRanges();
s.addRange(r);
let p=cursor();
paint(lines(),p);
}

ed.onkeydown=e=>{
if(e.key==="Enter"&&!composing){
e.preventDefault();
insertText("\n");
}
};

ed.onpaste=e=>{
e.preventDefault();
insertText(e.clipboardData.getData("text/plain"));
};

function totals(){
$("count").textContent=fmt(qty.reduce((a,b)=>a+b,0));
$("money").textContent=cash(qty.reduce((a,b,i)=>a+b*prices[i]*1000,0));
}

function render(){
$("rows").replaceChildren();
$("priceHead").style.display=show?"":"none";

codes.forEach((c,i)=>{
if(only&&!qty[i])return;

let tr=document.createElement("tr");
if(qty[i]>0)tr.className="active";

let name=document.createElement("td");
name.textContent=c;
name.style.fontWeight="bold";
tr.append(name);

let sum=document.createElement("td");

function field(value,max,fn,visible=true){
let td=document.createElement("td");
td.style.display=visible?"":"none";

let input=document.createElement("input");
input.type="text";
input.inputMode="numeric";
input.value=value;
input.maxLength=max;

input.oninput=()=>{
input.value=input.value.replace(/\D/g,"").slice(0,max);
fn(Number(input.value)||0);
sum.textContent=cash(qty[i]*prices[i]*1000);
tr.classList.toggle("active",qty[i]>0);
totals();
save();
};

input.onblur=()=>{
if(input.value==="")input.value="0";
};

td.append(input);
tr.append(td);
}

field(qty[i],9,v=>qty[i]=v);
field(prices[i],6,v=>prices[i]=v,show);

sum.textContent=cash(qty[i]*prices[i]*1000);
tr.append(sum);
$("rows").append(tr);
});

totals();
}

function note(s){
$("note").textContent=s;
}

$("remove").onclick=()=>{
paint(lines().filter(parse));
note("Đã xóa hết dòng đỏ");
};

$("add").onclick=()=>{
let a=entries().map(parse);
if(!a.length||a.some(x=>!x))return;

let sums=codes.map(()=>0);
a.forEach(x=>sums[x.i]+=x.n);
let key=sums.join(",");

if(seen.has(key)){
note("Danh sách bị trùng, không cộng lại");
return;
}

seen.add(key);
sums.forEach((n,i)=>qty[i]+=n);

paint([]);
render();
note("Đã cộng dồn thành công");
save();
};

$("toggle").onclick=()=>{
show=!show;
$("toggle").textContent=show?"ẨN BẢNG GIÁ":"HIỆN BẢNG GIÁ";
render();
};

$("filter").onclick=()=>{
only=!only;
$("filter").textContent=only?"HIỆN ĐỦ 39 MÃ":"CHỈ HIỆN CÓ ĐƠN";
render();
};

async function copy(s){
try{
await navigator.clipboard.writeText(s);
note("Đã sao chép");
}catch(e){
let t=document.createElement("textarea");
t.value=s;
t.style.position="fixed";
t.style.opacity="0";
document.body.append(t);
t.select();
try{
let ok=document.execCommand("copy");
note(ok?"Đã sao chép":"Không thể sao chép");
}catch(err){
note("Không thể sao chép");
}
t.remove();
}
}

$("copy").onclick=()=>copy(
codes.map((c,i)=>qty[i]?
c+" "+qty[i]+" = "+cash(qty[i]*prices[i]*1000):
"").filter(Boolean).join("\n")+
"\nTỔNG SỐ ĐƠN: "+$("count").textContent+
"\nTỔNG SỐ TIỀN: "+$("money").textContent
);

$("copyPrice").onclick=()=>copy(
codes.map((c,i)=>c+" "+cash(prices[i]*1000)).join("\n")
);

$("reset").onclick=()=>{
if(!confirm("Xóa toàn bộ số lượng, giữ nguyên giá?"))return;
qty.fill(0);
seen.clear();
render();
note("Đã xóa số lượng, giữ nguyên giá");
save();
};

render();
check();
</script>
</body>
</html>
